<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>平台接入 - 优化预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#f5f6f8; padding:32px; }
  .page { max-width:1100px; margin:0 auto; }
  .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .page-header h2 { font-size:18px; color:#1a1a1a; font-weight:600; }
  .refresh-btn { background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:8px 16px; font-size:13px; color:#555; cursor:pointer; }

  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }

  .card { background:#fff; border-radius:12px; padding:20px 24px; display:flex; align-items:center; gap:16px;
          border-left:4px solid #d1d5db; transition:all .2s; }
  .card.online { border-left-color:#10b981; background:linear-gradient(90deg,#ecfdf5 0%,#fff 60%); }
  .card:hover { box-shadow:0 4px 16px rgba(0,0,0,.06); transform:translateY(-1px); }

  .icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .icon-wechat { background:#07c160; color:#fff; }
  .icon-dingtalk { background:#1677ff; color:#fff; }
  .icon-pagermaid { background:#7c3aed; color:#fff; }
  .icon-qq { background:#12b7f5; color:#fff; }
  .icon-web { background:#f59e0b; color:#fff; }
  .icon-gewe { background:#10b981; color:#fff; }

  .info { flex:1; min-width:0; }
  .info .name { font-size:15px; font-weight:600; color:#1a1a1a; }
  .info .sub { font-size:12px; color:#9ca3af; margin-top:2px; }
  .info .status { display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:12px; }
  .dot { width:7px; height:7px; border-radius:50%; }
  .dot.on { background:#10b981; }
  .dot.off { background:#d1d5db; }
  .status.on { color:#10b981; }
  .status.off { color:#9ca3af; }

  .actions { display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .switch { width:44px; height:24px; border-radius:12px; background:#1a1a1a; position:relative; cursor:pointer; }
  .switch::after { content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; right:2px; transition:.2s; }
  .switch.off { background:#d1d5db; }
  .switch.off::after { right:22px; }
  .gear { width:32px; height:32px; border-radius:8px; background:#f3f4f6; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#6b7280; }
  .gear:hover { background:#e5e7eb; color:#1a1a1a; }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h2>平台接入</h2>
    <button class="refresh-btn">↻ 刷新状态</button>
  </div>
  <div class="grid">

    <div class="card online">
      <div class="icon icon-web">W</div>
      <div class="info">
        <div class="name">Web Bot</div>
        <div class="sub">web · 内置</div>
        <div class="status on"><span class="dot on"></span>已连接</div>
      </div>
      <div class="actions">
        <div class="switch"></div>
        <div class="gear">⚙</div>
      </div>
    </div>

    <div class="card">
      <div class="icon icon-wechat">💬</div>
      <div class="info">
        <div class="name">微信 ClawBot</div>
        <div class="sub">clawbot · 内置</div>
        <div class="status off"><span class="dot off"></span>未连接</div>
      </div>
      <div class="actions">
        <div class="switch"></div>
        <div class="gear">⚙</div>
      </div>
    </div>

    <div class="card">
      <div class="icon icon-dingtalk">📌</div>
      <div class="info">
        <div class="name">钉钉机器人</div>
        <div class="sub">dingtalk · 内置</div>
        <div class="status off"><span class="dot off"></span>未连接</div>
      </div>
      <div class="actions">
        <div class="switch"></div>
        <div class="gear">⚙</div>
      </div>
    </div>

    <div class="card">
      <div class="icon icon-pagermaid">📦</div>
      <div class="info">
        <div class="name">Pagermaid</div>
        <div class="sub">pagermaid · 内置</div>
        <div class="status off"><span class="dot off"></span>未连接</div>
      </div>
      <div class="actions">
        <div class="switch"></div>
        <div class="gear">⚙</div>
      </div>
    </div>

    <div class="card">
      <div class="icon icon-qq">🐧</div>
      <div class="info">
        <div class="name">QQ</div>
        <div class="sub">qq · 内置</div>
        <div class="status off"><span class="dot off"></span>未连接</div>
      </div>
      <div class="actions">
        <div class="switch"></div>
        <div class="gear">⚙</div>
      </div>
    </div>

    <div class="card">
      <div class="icon icon-gewe">📱</div>
      <div class="info">
        <div class="name">GeWe 微信</div>
        <div class="sub">gewe · 内置</div>
        <div class="status off"><span class="dot off"></span>未连接</div>
      </div>
      <div class="actions">
        <div class="switch off"></div>
        <div class="gear">⚙</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
